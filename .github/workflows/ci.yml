name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo_pgsql
          coverage: none

      - name: Install dependencies
        working-directory: app
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        working-directory: app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        working-directory: app
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan)
        working-directory: app
        run: ./vendor/bin/phpstan analyse

      - name: Tests (Pest)
        working-directory: app
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: app
          DB_PASSWORD: secret
        run: ./vendor/bin/pest

      - name: Dependency audit (SCA)
        working-directory: app
        run: composer audit

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (arm64) to tarball
        uses: docker/build-push-action@v7
        with:
          context: ./app
          target: production
          platforms: linux/arm64
          outputs: type=docker,dest=/tmp/image.tar

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/image.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ./app
          target: production
          platforms: linux/arm64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/scalable-ecommerce:${{ github.sha }}