services:
  app:
    build:
      context: ./app
      target: dev
    env_file: app/.env
    ports:
      - "8080:8080"
    volumes:
      - ./app:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/up"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-app}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dbdata:
